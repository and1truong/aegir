version: 2
project_name: aegir

before:
  hooks:
    - bun install --cwd web --frozen-lockfile
    - bun run --cwd web build
    - go generate ./internal/frontend

builds:
  - id: aegir
    main: ./cmd/aegir
    binary: aegir
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - aegir
    formats:
      - tar.gz

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  prerelease: auto
