name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }}, Bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.x"]
        bun: ["1.4.0"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install frontend dependencies
        run: bun install --cwd web --frozen-lockfile

      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet Go
        run: go vet ./...

      - name: Test Go
        run: go test ./...

      - name: Test, type-check, and embed frontend
        run: |
          bun run --cwd web test
          bun run --cwd web typecheck
          bun run --cwd web build
          go generate ./internal/frontend
          go build ./cmd/aegir
