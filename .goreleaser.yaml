version: 2
project_name: aegir

before:
  hooks:
    - npm --prefix web ci
    - npm --prefix web run build

builds:
  - id: aegir
    main: ./cmd/aegir
    binary: aegir
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

  - id: aegir-analyzer
    main: ./cmd/aegir-analyzer
    binary: aegir-analyzer
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - aegir
      - aegir-analyzer
    formats:
      - tar.gz
    files:
      - README.md
      - web/dist/**

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  prerelease: auto
